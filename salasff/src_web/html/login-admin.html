<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salas FF — Acesso Admin</title>
  <meta name="description" content="Painel administrativo Salas FF. Acesso restrito.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent:       #6366f1;
      --accent-light: #818cf8;
      --accent-glow:  rgba(99,102,241,0.2);
      --accent-dim:   rgba(99,102,241,0.1);
      --accent-border:rgba(99,102,241,0.3);
      --green:        #10b981;
      --red:          #ef4444;
      --red-dim:      rgba(239,68,68,0.1);
      --red-border:   rgba(239,68,68,0.25);
      --yellow:       #f59e0b;
      --yellow-dim:   rgba(245,158,11,0.1);
      --yellow-border:rgba(245,158,11,0.25);
      --bg-base:    #050505;
      --bg-surface: #0a0a0a;
      --bg-elevated:#111111;
      --border:     rgba(255,255,255,0.06);
      --border-hover:rgba(255,255,255,0.12);
      --text-primary:  #f8fafc;
      --text-secondary:#94a3b8;
      --text-muted:    #475569;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg-base);
      color: var(--text-primary);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* ── Animated background ── */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-mesh::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      top: -200px;
      left: -200px;
      background: radial-gradient(circle, rgba(99,102,241,0.07) 0%, transparent 65%);
      border-radius: 50%;
      animation: float1 12s ease-in-out infinite;
    }

    .bg-mesh::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      bottom: -150px;
      right: -150px;
      background: radial-gradient(circle, rgba(99,102,241,0.05) 0%, transparent 65%);
      border-radius: 50%;
      animation: float2 16s ease-in-out infinite;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, 30px) scale(1.05); }
      66%  { transform: translate(-20px, 50px) scale(0.97); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-50px, -40px) scale(1.08); }
    }

    /* ── Card wrapper ── */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Brand ── */
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      box-shadow: 0 8px 32px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 18px;
      animation: logoPulse 4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 32px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.4); }
      50%  { box-shadow: 0 12px 48px rgba(99,102,241,0.35), 0 2px 8px rgba(0,0,0,0.4); }
    }

    .login-brand-logo svg {
      width: 26px;
      height: 26px;
      color: #fff;
    }

    .login-brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .login-brand h1 span { color: var(--accent-light); }

    .login-brand p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── Card ── */
    .login-card {
      background: rgba(255,255,255,0.028);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Error message */
    .login-erro {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: var(--red-dim);
      border: 1px solid var(--red-border);
      border-radius: 10px;
      font-size: 12.5px;
      color: var(--red);
      margin-bottom: 18px;
      animation: fadeIn 0.25s ease;
    }

    .login-erro.visivel { display: flex; }

    .login-erro svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Description */
    .login-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Discord button */
    .btn-discord {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      background: #5865F2;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(88,101,242,0.3);
    }

    .btn-discord:hover {
      background: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(88,101,242,0.4);
      color: #fff;
    }

    .btn-discord:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(88,101,242,0.2);
    }

    .btn-discord svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divider */
    .login-divider {
      margin: 16px 0;
    }

    /* Warning notice */
    .login-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 13px;
      background: var(--yellow-dim);
      border: 1px solid var(--yellow-border);
      border-radius: 10px;
      font-size: 12px;
      color: var(--yellow);
      line-height: 1.55;
    }

    .login-notice svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 22px;
    }

    .login-footer a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .login-footer a:hover { color: var(--text-secondary); }

    .login-footer a svg {
      width: 13px;
      height: 13px;
    }

    .login-footer-copy {
      font-size: 11px;
      color: var(--text-faint, #1e293b);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-mesh"></div>

  <div class="login-wrapper">
    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>Salas FF <span>Admin</span></h1>
      <p>Painel de administração</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <!-- Error -->
      <div class="login-erro" id="erro-msg" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span id="erro-texto">Acesso negado. Sua conta não tem permissão de administrador.</span>
      </div>

      <p class="login-desc">
        Autentique-se com sua conta do Discord autorizada para acessar o painel.
      </p>

      <a href="/admin/oauth" class="btn-discord" id="btn-login-discord">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        Entrar com Discord
      </a>

      <div class="login-divider"></div>

      <div class="login-notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>Acesso restrito. Apenas contas Discord autorizadas podem acessar este painel.</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <a href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Voltar ao início
      </a>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('erro') === '1' || window.location.pathname === '/erro-acesso') {
        document.getElementById('erro-msg').classList.add('visivel');
      }
    })();
  </script>
</body>
</html>
