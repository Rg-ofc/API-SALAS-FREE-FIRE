<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Negado — Salas FF</title>
  <meta name="description" content="Acesso negado. Você não tem permissão para acessar este painel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red:        #ef4444;
      --red-dim:    rgba(239,68,68,0.08);
      --red-border: rgba(239,68,68,0.2);
      --accent:     #6366f1;
      --bg-base:    #050505;
      --border:     rgba(255,255,255,0.06);
      --border-hover:rgba(255,255,255,0.12);
      --text-primary:  #f8fafc;
      --text-secondary:#94a3b8;
      --text-muted:    #475569;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg-base);
      color: var(--text-primary);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Background */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(239,68,68,0.04) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Content */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: pageIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Icon */
    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: var(--red-dim);
      border: 1px solid var(--red-border);
      margin: 0 auto 28px;
      animation: iconShake 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    @keyframes iconShake {
      0% { transform: scale(0.8) rotate(-8deg); opacity: 0; }
      60% { transform: scale(1.06) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    .icon-box svg {
      width: 36px;
      height: 36px;
      color: var(--red);
    }

    /* Text */
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 32px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Code/error detail */
    .error-code {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 99px;
      margin-bottom: 28px;
    }

    .error-code-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
    }

    /* Button */
    .btn-voltar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-voltar:hover {
      background: rgba(255,255,255,0.07);
      border-color: var(--border-hover);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .btn-voltar:active {
      transform: translateY(0);
    }

    .btn-voltar svg {
      width: 15px;
      height: 15px;
    }

    /* Footer */
    .error-footer {
      margin-top: 40px;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="wrapper">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
      </svg>
    </div>

    <div class="error-code">
      <span class="error-code-dot"></span>
      Erro 403 — Proibido
    </div>

    <h1>Acesso Negado</h1>

    <p class="subtitle">
      Sua conta do Discord não possui permissão para acessar o painel administrativo.
      Apenas contas autorizadas podem entrar.
    </p>

    <a href="/admin" class="btn-voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Tentar novamente
    </a>

    <div class="error-footer">Salas FF © 2025</div>
  </div>
</body>
</html>
