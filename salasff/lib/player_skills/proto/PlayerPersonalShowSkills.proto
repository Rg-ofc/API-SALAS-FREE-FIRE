syntax = "proto3";

package VanyPlayerShow;

message request {
  uint64 accountId = 1;
  uint32 callSignSrc = 2;
  optional bool needGalleryInfo = 3;
  optional bool needBlacklist = 4;
  optional bool needSparkInfo = 5;
}

message AvatarProfile {
  uint32 avatarid = 1;
  uint32 skincolor = 2;
  repeated uint32 clothes = 3;
  repeated uint32 equipedskills = 4;
  bool isselected = 5;
  uint32 pveprimaryweapon = 6;
  bool isselectedawaken = 7;
  uint32 endtime = 8;
}

message PetSkillInfo {
  uint32 petid = 1;
  uint32 skillid = 2;
  uint32 skilllevel = 3;
}

message PetInfo {
  uint32 id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 exp = 4;
  bool isselected = 5;
  uint32 skinid = 6;
  repeated uint32 actions = 7;
  repeated PetSkillInfo skills = 8;
  uint32 selectedskillid = 9;
  bool ismarkedstar = 10;
  uint32 endtime = 11;
}

message BasicInfo {
  uint64 accountid = 1;
  string nickname = 2;
  string region = 3;
  uint64 exp = 4;
  uint32 level = 5;
  uint32 rank = 6;
  uint32 rankingpoints = 7;
  uint32 headpic = 8;
  uint32 bannerid = 9;
}

message response {
  BasicInfo basicinfo = 1;
  AvatarProfile profileinfo = 2;
  PetInfo petinfo = 8;
}
